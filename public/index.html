<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Is This A Ghost? - Real-time Paranormal News Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #1a2938;
            color: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 50px 20px 40px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(168, 213, 186, 0.1);
        }

        .logo-section {
            margin-bottom: 20px;
        }

        .ghost-icon {
            font-size: 4em;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 20px rgba(168, 213, 186, 0.3));
        }

        h1 {
            font-size: 3.5em;
            margin-bottom: 15px;
            color: #f5f5f5;
            font-weight: 900;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .brand-highlight {
            color: #7fc29b;
        }

        .subtitle {
            font-size: 1.1em;
            color: #a8d5ba;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .last-updated {
            font-size: 0.9em;
            color: #7a8c9e;
            margin-top: 15px;
            padding: 10px 20px;
            background: rgba(127, 194, 155, 0.1);
            border-radius: 20px;
            display: inline-block;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            align-items: center;
            border: 1px solid rgba(168, 213, 186, 0.1);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 0.85em;
            color: #a8d5ba;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, input {
            padding: 12px 16px;
            border: 2px solid rgba(127, 194, 155, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #f5f5f5;
            font-size: 1em;
            transition: all 0.3s;
            font-family: inherit;
        }

        select:hover, input:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(127, 194, 155, 0.4);
        }

        select:focus, input:focus {
            outline: none;
            border-color: #7fc29b;
            background: rgba(255, 255, 255, 0.08);
        }

        button {
            cursor: pointer;
            background: #7fc29b;
            border: none;
            font-weight: 700;
            padding: 12px 28px;
            border-radius: 8px;
            color: #1a2938;
            font-size: 1em;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: inherit;
        }

        button:hover {
            background: #a8d5ba;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(127, 194, 155, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(168, 213, 186, 0.1);
            transition: all 0.3s;
        }

        .stat-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(127, 194, 155, 0.3);
            transform: translateY(-3px);
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: 900;
            color: #7fc29b;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 0.9em;
            color: #a8d5ba;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .stories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .story-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            padding: 25px;
            transition: all 0.3s;
            border: 1px solid rgba(168, 213, 186, 0.1);
            position: relative;
            overflow: hidden;
        }

        .story-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #7fc29b, #a8d5ba);
        }

        .story-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(127, 194, 155, 0.2);
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(127, 194, 155, 0.3);
        }

        .story-header {
            margin-bottom: 15px;
        }

        .story-title {
            font-size: 1.3em;
            margin-bottom: 10px;
            color: #f5f5f5;
            line-height: 1.4;
            font-weight: 700;
        }

        .story-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .tag {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tag.type {
            background: rgba(127, 194, 155, 0.15);
            color: #7fc29b;
            border: 1px solid rgba(127, 194, 155, 0.3);
        }

        .tag.location {
            background: rgba(245, 245, 245, 0.1);
            color: #a8d5ba;
            border: 1px solid rgba(168, 213, 186, 0.2);
        }

        .story-summary {
            color: #c5d3dd;
            line-height: 1.6;
            margin-bottom: 15px;
            font-size: 0.95em;
        }

        .story-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(168, 213, 186, 0.1);
        }

        .popularity {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .popularity-icon {
            color: #7fc29b;
            font-size: 1.1em;
        }

        .popularity-bar {
            width: 100px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .popularity-fill {
            height: 100%;
            background: linear-gradient(90deg, #7fc29b, #a8d5ba);
            transition: width 0.3s;
        }

        .popularity-score {
            color: #7fc29b;
            font-weight: 700;
            font-size: 0.9em;
        }

        .read-more {
            color: #7fc29b;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .read-more:hover {
            color: #a8d5ba;
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            padding: 60px;
            font-size: 1.3em;
            color: #7fc29b;
        }

        .no-results {
            text-align: center;
            padding: 60px;
            font-size: 1.2em;
            color: #7a8c9e;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(127, 194, 155, 0.3);
            border-top-color: #7fc29b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .auto-refresh-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(26, 41, 56, 0.95);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid rgba(127, 194, 155, 0.3);
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .auto-refresh-indicator .timer {
            color: #7fc29b;
            font-weight: 700;
            font-size: 0.9em;
        }

        .auto-refresh-indicator .label {
            color: #a8d5ba;
            font-size: 0.85em;
            margin-bottom: 5px;
        }

        .source-tag {
            font-size: 0.75em;
            color: #7a8c9e;
            font-style: italic;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .stories-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            .control-group {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-section">
                <div class="ghost-icon">👻</div>
            </div>
            <h1>IS THIS A <span class="brand-highlight">GHOST</span>?</h1>
            <div class="subtitle">Real-time paranormal news from around the world</div>
            <div class="last-updated" id="lastUpdated">Loading...</div>
        </header>

        <div class="controls">
            <div class="control-group">
                <label>Sort By:</label>
                <select id="sortBy">
                    <option value="date">Date (Newest First)</option>
                    <option value="popularity">Popularity</option>
                    <option value="location">Location</option>
                    <option value="type">Haunting Type</option>
                </select>
            </div>

            <div class="control-group">
                <label>Filter by Type:</label>
                <select id="filterType">
                    <option value="">All Types</option>
                    <option value="poltergeist">Poltergeist</option>
                    <option value="apparition">Apparition</option>
                    <option value="demonic">Demonic</option>
                    <option value="spirit">Spirit</option>
                    <option value="haunted">Haunted Location</option>
                </select>
            </div>

            <div class="control-group">
                <label>Filter by Location:</label>
                <input type="text" id="filterLocation" placeholder="Enter location...">
            </div>

            <button id="refreshBtn" onclick="refreshStories()">
                🔄 Refresh Now
            </button>

            <button onclick="clearFilters()">
                ✖️ Clear Filters
            </button>
        </div>

        <div class="stats" id="stats"></div>

        <div id="storiesContainer">
            <div class="loading">
                <div class="spinner"></div>
                <div>Loading ghost stories...</div>
            </div>
        </div>

        <div class="auto-refresh-indicator">
            <div class="label">⏰ Auto-refresh: Every hour</div>
            <div class="timer">Next update in <span id="countdown">60:00</span></div>
        </div>
    </div>

    <script>
        let allStories = [];
        let nextRefreshTime = Date.now() + 3600000; // 1 hour from now

        // Load stories on page load
        window.addEventListener('load', () => {
            loadStories();
            updateCountdown();
            setInterval(updateCountdown, 1000);

            // Auto-refresh every hour
            setInterval(() => {
                refreshStories();
            }, 3600000); // 60 minutes
        });

        // Add event listeners for filters
        document.getElementById('sortBy').addEventListener('change', applyFilters);
        document.getElementById('filterType').addEventListener('change', applyFilters);
        document.getElementById('filterLocation').addEventListener('input', applyFilters);

        async function loadStories() {
            try {
                const response = await fetch('/api/stories');
                const data = await response.json();
                allStories = data.stories;

                document.getElementById('lastUpdated').textContent =
                    `Last updated: ${new Date(data.lastUpdated).toLocaleString()}`;

                await loadStats();
                applyFilters();
            } catch (error) {
                console.error('Error loading stories:', error);
                document.getElementById('storiesContainer').innerHTML =
                    '<div class="no-results">Error loading stories. Please try refreshing.</div>';
            }
        }

        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const stats = await response.json();

                const statsHtml = `
                    <div class="stat-card">
                        <div class="stat-value">${stats.totalStories}</div>
                        <div class="stat-label">Total Stories</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${Object.keys(stats.typeDistribution).length}</div>
                        <div class="stat-label">Haunting Types</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.topLocations.length}</div>
                        <div class="stat-label">Locations</div>
                    </div>
                `;

                document.getElementById('stats').innerHTML = statsHtml;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        function applyFilters() {
            const sortBy = document.getElementById('sortBy').value;
            const filterType = document.getElementById('filterType').value;
            const filterLocation = document.getElementById('filterLocation').value;

            let filtered = [...allStories];

            // Apply filters
            if (filterType) {
                filtered = filtered.filter(story =>
                    story.hauntingTypes.some(type =>
                        type.toLowerCase().includes(filterType.toLowerCase())
                    )
                );
            }

            if (filterLocation) {
                filtered = filtered.filter(story =>
                    story.location.toLowerCase().includes(filterLocation.toLowerCase())
                );
            }

            // Apply sorting
            if (sortBy === 'popularity') {
                filtered.sort((a, b) => b.popularity - a.popularity);
            } else if (sortBy === 'date') {
                filtered.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
            } else if (sortBy === 'location') {
                filtered.sort((a, b) => a.location.localeCompare(b.location));
            } else if (sortBy === 'type') {
                filtered.sort((a, b) => a.hauntingTypes[0].localeCompare(b.hauntingTypes[0]));
            }

            displayStories(filtered);
        }

        function displayStories(stories) {
            const container = document.getElementById('storiesContainer');

            if (stories.length === 0) {
                container.innerHTML = '<div class="no-results">No stories found matching your filters.</div>';
                return;
            }

            const storiesHtml = stories.map(story => `
                <div class="story-card">
                    <div class="story-header">
                        <h3 class="story-title">${escapeHtml(story.title)}</h3>
                        <div class="source-tag">Source: ${escapeHtml(story.source)}</div>
                    </div>
                    <div class="story-meta">
                        ${story.hauntingTypes.map(type =>
                            `<span class="tag type">${escapeHtml(type)}</span>`
                        ).join('')}
                        <span class="tag location">📍 ${escapeHtml(story.location)}</span>
                    </div>
                    <div class="story-summary">${escapeHtml(story.summary)}</div>
                    <div class="story-footer">
                        <div class="popularity">
                            <span class="popularity-icon">🔥</span>
                            <div class="popularity-bar">
                                <div class="popularity-fill" style="width: ${story.popularity}%"></div>
                            </div>
                            <span class="popularity-score">${Math.round(story.popularity)}</span>
                        </div>
                        <a href="${escapeHtml(story.link)}" target="_blank" class="read-more">
                            Read More →
                        </a>
                    </div>
                </div>
            `).join('');

            container.innerHTML = `<div class="stories-grid">${storiesHtml}</div>`;
        }

        async function refreshStories() {
            const btn = document.getElementById('refreshBtn');
            btn.disabled = true;
            btn.textContent = '🔄 Refreshing...';

            try {
                const response = await fetch('/api/refresh');
                const data = await response.json();

                await loadStories();
                nextRefreshTime = Date.now() + 3600000; // Reset countdown

                btn.textContent = '✓ Refreshed!';
                setTimeout(() => {
                    btn.textContent = '🔄 Refresh Now';
                    btn.disabled = false;
                }, 2000);
            } catch (error) {
                console.error('Error refreshing:', error);
                btn.textContent = '❌ Error';
                setTimeout(() => {
                    btn.textContent = '🔄 Refresh Now';
                    btn.disabled = false;
                }, 2000);
            }
        }

        function clearFilters() {
            document.getElementById('sortBy').value = 'date';
            document.getElementById('filterType').value = '';
            document.getElementById('filterLocation').value = '';
            applyFilters();
        }

        function updateCountdown() {
            const remaining = Math.max(0, nextRefreshTime - Date.now());
            const minutes = Math.floor(remaining / 60000);
            const seconds = Math.floor((remaining % 60000) / 1000);
            document.getElementById('countdown').textContent =
                `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
